name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: "What to publish"
        required: true
        type: choice
        options:
          - pypi
          - crates
          - npm
          - all

jobs:
  # ── PyPI: Rust-powered Python package (maturin) ──
  publish-pypi:
    name: PyPI (${{ matrix.os }})
    if: github.event.inputs.target == 'pypi' || github.event.inputs.target == 'all' || github.event_name == 'release'
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: packages/python
          args: --release --out dist
          target: ${{ matrix.target }}
      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: packages/python/dist/*.whl

  publish-pypi-upload:
    name: Upload to PyPI
    needs: publish-pypi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist
      - name: Publish to PyPI
        uses: PyO3/maturin-action@v1
        with:
          command: upload
          args: --non-interactive dist/*
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}

  # ── crates.io: Rust core library ──
  publish-crates:
    name: crates.io
    if: github.event.inputs.target == 'crates' || github.event.inputs.target == 'all' || github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test --manifest-path core/Cargo.toml --lib
      - name: Publish
        run: cargo publish --manifest-path core/Cargo.toml
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}

  # ── npm: WASM core + JS viewer ──
  publish-npm:
    name: npm
    if: github.event.inputs.target == 'npm' || github.event.inputs.target == 'all' || github.event_name == 'release'
    runs-on: ubuntu-latest
    # npm Trusted Publishing (OIDC): no NPM_TOKEN; needs id-token and npm >= 11.5.1.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g npm@latest
      - uses: dtolnay/rust-toolchain@stable

      # `core/pkg` is wasm-pack's output and is not in the repository, so the
      # job used to die on `working-directory: core/pkg` before running a
      # single command — the shell cannot start in a directory that does not
      # exist, which is a step failure that `|| true` never gets to see.
      - name: Build @markdown-media/wasm
        run: |
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          wasm-pack build core --target web --out-dir pkg
      # wasm-pack names the package after the crate (`mdm-core`); the npm
      # package and its Trusted Publisher entry are `@markdown-media/wasm`.
      # Skip a version that is already on npm instead of hiding every failure.
      - name: Publish @markdown-media/wasm
        working-directory: core/pkg
        run: |
          npm pkg set name=@markdown-media/wasm
          V=$(node -p "require('./package.json').version")
          if npm view "@markdown-media/wasm@$V" version >/dev/null 2>&1; then
            echo "@markdown-media/wasm@$V already published, skipping"
          else
            npm publish --access public
          fi

      # Never published yet: OIDC cannot create a package, so the first
      # release must be a manual `npm publish`, then add a Trusted Publisher.
      - name: Publish @markdown-media/viewer
        working-directory: packages/viewer-js
        run: |
          npm install
          npm publish --access public || true
